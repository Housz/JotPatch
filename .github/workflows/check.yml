name: Build and validate
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typecheck-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Build dev Chromium package
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: node scripts/package.mjs --channel=dev --build=${{ github.run_number }}
      - name: Upload dev installable ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: jotpatch-chromium-dev-${{ github.run_number }}
          path: artifacts/JotPatch-*-chromium.zip
          if-no-files-found: error
