name: Build and validate
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typecheck-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Build dev Chromium package
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: node scripts/package.mjs --channel=dev --build=${{ github.run_number }}
      - name: Upload dev installable ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: jotpatch-chromium-dev-${{ github.run_number }}
          path: artifacts/JotPatch-*-chromium.zip
          if-no-files-found: error

  cross-browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Install Python browser testing dependencies
        run: python -m pip install playwright selenium
      - name: Install Playwright Chromium and Firefox
        run: python -m playwright install --with-deps chromium firefox
      - name: Install system Firefox for real add-on smoke
        id: system-firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest
      - name: Package Firefox add-on for the source channel
        run: node scripts/package.mjs --channel=$(node -p 'JSON.parse(require("node:fs").readFileSync("config/version.json","utf8")).channel') --browser=firefox
      - name: Validate Firefox package with Mozilla tooling
        run: npx --yes web-ext lint --source-dir build/firefox --self-hosted
      - name: Chromium real-DOM regression
        env:
          JP_CHROMIUM_BIN: playwright
        run: |
          python tests/browser_e2e.py
          python tests/unified_dock_e2e.py
          python tests/dock_polish_e2e.py
          python tests/editor_fold_e2e.py
          python tests/math_selection_e2e.py
          python tests/conversation_e2e.py
          python tests/spatial_rail_e2e.py
          python tests/stable_rail_e2e.py
          python tests/optimization_e2e.py
          python tests/virtualized_notes_e2e.py
          python tests/branding_e2e.py
          python tests/navigation_recovery_e2e.py
      - name: Firefox real-DOM regression
        env:
          JP_E2E_BROWSER: firefox
        run: |
          python tests/browser_e2e.py
          python tests/unified_dock_e2e.py
          python tests/dock_polish_e2e.py
          python tests/editor_fold_e2e.py
          python tests/math_selection_e2e.py
          python tests/conversation_e2e.py
          python tests/spatial_rail_e2e.py
          python tests/stable_rail_e2e.py
          python tests/optimization_e2e.py
          python tests/virtualized_notes_e2e.py
          python tests/branding_e2e.py
          python tests/navigation_recovery_e2e.py
      - name: Firefox actual installed MV3 event-page smoke
        env:
          FIREFOX_BIN: ${{ steps.system-firefox.outputs.firefox-path }}
        run: python tests/firefox_addon_smoke.py
