name: Publish release

# A release PR changes config/version.json to channel=release and is merged
# to main with a merge commit. This job then creates the annotated tag AND
# GitHub Release in the same run. Tags pushed with GITHUB_TOKEN do not trigger
# new workflow runs, so do not depend on a tag-push workflow for publishing.
on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: jotpatch-publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify this is an approved release commit on main
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            import {loadVersionConfig,verifySourceVersions} from "./scripts/versioning.mjs";
            const c=loadVersionConfig();
            if(c.channel!=="release") throw Error("Only release-channel commits may publish");
            verifySourceVersions(".",c);
            if(process.env.GITHUB_REF_TYPE==="tag" && process.env.GITHUB_REF_NAME!==`v${c.nextRelease}`)
              throw Error("Tag does not match release version");
          '
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run package:release
      - name: Package Firefox from the same source commit
        run: node scripts/package.mjs --channel=release --browser=firefox
      - name: Validate both distributables and shared runtime identity
        run: node scripts/verify-release-package.mjs
      - name: Mozilla validation of Firefox distributable
        run: npx --yes web-ext lint --source-dir build/firefox --self-hosted
      - name: Optionally sign a normal-installable Firefox XPI via AMO
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$AMO_JWT_ISSUER" ] && [ -n "$AMO_JWT_SECRET" ]; then
            mkdir -p artifacts/signed
            npx --yes web-ext sign --source-dir build/firefox --artifacts-dir artifacts/signed \
              --channel=unlisted --api-key="$AMO_JWT_ISSUER" --api-secret="$AMO_JWT_SECRET" --no-input
            signed=$(find artifacts/signed -maxdepth 1 -name '*.xpi' -type f | head -1)
            test -n "$signed"
            version=$(node -p 'JSON.parse(require("node:fs").readFileSync("config/version.json", "utf8")).nextRelease')
            cp "$signed" "artifacts/JotPatch-v${version}-firefox-signed.xpi"
          else
            echo "AMO signing credentials unavailable; only temporary-install Firefox ZIP will be published." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Tag main commit and publish both verified browser ZIPs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p 'JSON.parse(require("node:fs").readFileSync("config/version.json", "utf8")).nextRelease')
          tag="v${version}"
          chromium_zip="artifacts/JotPatch-${tag}-chromium.zip"
          firefox_zip="artifacts/JotPatch-${tag}-firefox.zip"
          assets=("$chromium_zip" "$firefox_zip")
          signed="artifacts/JotPatch-${tag}-firefox-signed.xpi"
          if [ -f "$signed" ]; then assets+=("$signed"); fi
          notes="docs/RELEASE_NOTES_${version//./_}.md"
          test -f "$notes"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            target=$(git rev-list -n 1 "$tag")
            if [ "$target" != "$(git rev-parse HEAD)" ]; then
              if gh release view "$tag" >/dev/null 2>&1; then
                echo "Release $tag already exists for its original tagged commit; no new publication."
                exit 0
              fi
              echo "Refusing to publish: $tag points to a different commit ($target)" >&2
              exit 1
            fi
          else
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "The triggering tag is unexpectedly missing" >&2
              exit 1
            fi
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                tag -a "$tag" -m "JotPatch $tag release" "$(git rev-parse HEAD)"
            git push origin "refs/tags/$tag"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists; nothing to overwrite."
            exit 0
          fi
          gh release create "$tag" "${assets[@]}" \
            --verify-tag --title "JotPatch $tag" \
            --notes-file "$notes" --latest
