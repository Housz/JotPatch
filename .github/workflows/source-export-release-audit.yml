name: Temporary source export for cross-browser audit
on:
  push:
    branches:
      - chore/export-20261026-release-audit
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle auditable source
        run: tar -czf "$RUNNER_TEMP/jotpatch-source.tar.gz" --exclude=.git --exclude=node_modules --exclude=artifacts --exclude=build --exclude=dist .
      - uses: actions/upload-artifact@v4
        with:
          name: jotpatch-source-release-audit
          path: ${{ runner.temp }}/jotpatch-source.tar.gz
          if-no-files-found: error
