name: Export development source
on:
  push:
    branches:
      - feature/0.1.11-spatial-fisheye-rail
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle source for reproducible development
        run: |
          tar -czf jotpatch-source.tar.gz --exclude=.git --exclude=node_modules --exclude=jotpatch-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: jotpatch-development-source
          path: jotpatch-source.tar.gz
          retention-days: 1
