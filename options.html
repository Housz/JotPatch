<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JotPatch · 网站自动恢复</title>
  <style>
    body {font: 15px/1.6 system-ui, sans-serif; max-width: 540px; margin: 72px auto; padding: 20px; color: #2b2924;}
    main {border: 1px solid #e8dfc7; border-radius: 18px; background: #fffbef; padding: 26px;}
    h1 {font-size: 23px; margin: 0 0 8px;} p {color:#625a4b;} label {display:block; font-weight:600; margin: 22px 0 6px;}
    input {width:100%; box-sizing:border-box; padding:10px 12px; border-radius:9px; border:1px solid #bfb5a1; font-size:15px;}
    button {background:#7059c1; color:white; padding:11px 18px; border:0; border-radius:9px; cursor:pointer; margin-top:14px; font-size:15px;}
    button:disabled {opacity:.5;cursor:default;} #status {min-height:24px;} small {color:#645a4c;}
  </style>
</head>
<body>
  <main>
    <h1>JotPatch · 自动恢复</h1>
    <p>允许这个网站在你刷新或再次访问时，自动显示已保存的便签和导航 Dock。只申请所选网站的访问权限。</p>
    <label for="origin">网站地址</label>
    <input id="origin" type="url" placeholder="https://chatgpt.com" spellcheck="false">
    <button id="grant">允许此网站自动恢复</button>
    <p id="status" role="status" aria-live="polite"></p>
    <small>未授权也能使用：打开网页后点击 JotPatch 扩展图标，即可手动恢复。暂不支持 chrome:// 页面。</small>
  </main>
  <script src="options.js"></script>
</body>
</html>
