<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JotPatch · 设置</title>
  <style>
    :root{color-scheme:light}*{box-sizing:border-box}
    body{font:14px/1.6 system-ui,-apple-system,'Segoe UI',sans-serif;color:#34312c;max-width:620px;margin:52px auto;padding:0 24px;background:#fcfbf7}
    h1{font-size:26px;font-weight:650;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}p{margin:3px 0 16px;color:#716c62}
    section{padding:22px 0;border-bottom:1px solid #e7e3d9}fieldset{border:0;margin:0;padding:0}
    .choice{display:flex;gap:12px;align-items:flex-start;padding:9px 0;cursor:pointer}.choice input{margin-top:6px;accent-color:#6c5ba4}
    .choice small{display:block;color:#716c62}label[for=origin]{display:block;font-weight:600;margin-bottom:6px}
    #origin{width:100%;padding:10px 12px;border:1px solid #d0c9bb;border-radius:7px;font:inherit;background:white}
    button{font:inherit;color:#403626;border:0;background:#efe9d9;border-radius:7px;padding:9px 14px;cursor:pointer;margin-top:12px}
    button:disabled{opacity:.5;cursor:default}#status{min-height:24px;color:#605944}footer{color:#777165;font-size:12px;margin:22px 0}.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.brand img{width:32px;height:32px;border-radius:7px}.brand-copy p{margin:2px 0 0}.micro{font-size:12px;color:#857d70}.inline-choice{display:flex;gap:14px;flex-wrap:wrap}
  </style>
</head>
<body>
  <div class="brand">
    <img src="icons/icon32.png" alt="JotPatch">
    <div class="brand-copy">
      <h1>JotPatch</h1>
      <p>随地大小贴</p>
      <div class="micro">Powered by Housz</div>
    </div>
  </div>
  <section>
    <h2>选中文字后的快捷图钉</h2>
    <fieldset aria-label="选区快捷图钉显示方式">
      <label class="choice"><input type="radio" name="selectionTrigger" value="always"><span>总是显示<small>选中网页文字后，在选区附近出现一个小图钉（默认）。</small></span></label>
      <label class="choice"><input type="radio" name="selectionTrigger" value="alt"><span>按住 Alt / Option 时显示<small>按住 Alt（Mac 为 Option），再拖动选中文字并松开鼠标；普通选区不会被打扰。</small></span></label>
      <label class="choice"><input type="radio" name="selectionTrigger" value="off"><span>从不显示<small>只通过选区右键菜单添加便签；扩展图标也可新建页面便签。</small></span></label>
    </fieldset>
    <p id="preference-status" role="status" aria-live="polite"></p>
    <p>右键菜单中的「📌 添加 JotPatch 便签」始终可用。图钉只会出现在普通网页选区，不会干扰文本输入框。</p>
  </section>

  <section>
    <h2>默认便签颜色</h2>
    <fieldset aria-label="默认便签颜色">
      <div class="inline-choice">
        <label class="choice"><input type="radio" name="defaultNoteColorMode" value="yellow"><span>固定黄色<small>每次新建便签默认使用黄色。</small></span></label>
        <label class="choice"><input type="radio" name="defaultNoteColorMode" value="random"><span>随机颜色<small>每次新建便签自动换一种颜色，并避免连续重复。</small></span></label>
      </div>
    </fieldset>
    <p id="color-status" role="status" aria-live="polite"></p>
  </section>

  <section>
    <h2>AI 会话导航</h2>
    <label class="choice"><input type="checkbox" id="conversation-navigation" checked><span>显示对话轮次导航
      <small>在 ChatGPT 与 Gemini 中用浅色短横线定位每一轮提问，已有彩色便签点共用同一条 Dock；普通网页不受影响。</small></span></label>
    <p id="conversation-status" role="status" aria-live="polite"></p>
    <label class="choice"><input type="checkbox" id="navigation-lab"><span>Navigation Lab <span class="micro">实验性</span>
      <small>试验长对话的分段恢复导航；默认关闭。仅在点击历史轮次时运行，可随时取消，不会预先滚动网页。</small></span></label>
    <p id="lab-status" role="status" aria-live="polite"></p>
    <p>若网页重新显示官方轮次导航，可在这里关闭 JotPatch 轮次横条。不会删除本页便签。</p>
  </section>
  <section>
    <h2>自动恢复</h2>
    <p>允许特定网站在刷新或再次访问时自动显示已保存的便签。不会要求访问所有网站。</p>
    <label for="origin">网站地址</label>
    <input id="origin" type="url" placeholder="https://chatgpt.com" spellcheck="false">
    <button type="button" id="grant">允许该网站自动恢复</button>
    <p id="status" role="status" aria-live="polite"></p>
  </section>
  <footer>所有设置和便签都保存在本地浏览器中。<br>Powered by Housz</footer>
  <script src="options.js"></script>
</body>
</html>
